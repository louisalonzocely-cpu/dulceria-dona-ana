<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${nombreTienda}">Tienda</title>
    <link rel="stylesheet" th:href="@{/css/dulceria.css}">
</head>
<body>
    <header class="encabezado">
        <h1 th:text="${nombreTienda}">Nombre de laTienda</h1>
        <p th:text="${eslogan}">Eslogan</p>
    </header>
    <main>
        <h2 th:text="${saludo}">¡Hola!</h2>
        <p>Cocadas, alegrias, panelitas, y conservas hechas a mano.</p>
        <p><strong>Horario:</strong><span th:text="${horario}">Horario</span></p>
        <p class="nota">Esta pagina es DINAMICA: los textos los envia al contolador en cada peticion.</p>
    </main>
</body>
</html>
